version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# Enceladus Mission Control — Production-like local stack
# Usage: docker compose -f infra/docker-compose.yml up
# ──────────────────────────────────────────────────────────────────────────────

networks:
  mission-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mc-postgres
    environment:
      POSTGRES_DB: mission_control
      POSTGRES_USER: mission
      POSTGRES_PASSWORD: mission
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mission-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission -d mission_control"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mc-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - mission-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mc-backend
    environment:
      DATABASE_URL: "postgresql+asyncpg://mission:mission@postgres:5432/mission_control"
      REDIS_URL: "redis://redis:6379/0"
      DEBUG: "false"
      LOG_LEVEL: "INFO"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://frontend:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mission-net
    volumes:
      - ../backend:/app
    restart: unless-stopped

  # ── Frontend (dev server via Vite) ──────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: mc-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE: "http://backend:8000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - mission-net
